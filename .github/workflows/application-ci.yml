name: Application CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '.github/workflows/application-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnp3-analyzer-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WPF analyzer
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore ./DNP3_ProtocolAnalyzer.csproj

      - name: Build
        shell: pwsh
        run: dotnet build ./DNP3_ProtocolAnalyzer.csproj -c Release --no-restore -warnaserror
